metadata:
  description: 'Provider knowledge bundles from NASA DAACs, one per archive: PO.DAAC (ECCO, SWOT, GRACE-FO,
    MUR, NASA-SSH, RAPID), ASDC (CERES radiation budget), NSIDC (land ice and sea ice), GES DISC (MERRA-2,
    AIRS, OMI, solar-induced fluorescence), LP DAAC (land surface), OB.DAAC (ocean color), ORNL DAAC (surface
    meteorology and biogeochemistry) and the ESDIS metadata requirements. Facts about data, signed by their
    stewards; no skills.'
