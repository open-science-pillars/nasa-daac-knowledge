name: gate
# The repository's check routine, tools/run_checks.sh, on every change:
# both bundles conform to OKF v0.2, every tool passes its selftest, and
# the signature debt is measured. The debt is reported on pull requests
# and on main (merge-then-sign: a concept may owe a signature between a
# merge and its re-sign) and enforced on a release tag, which must owe
# none. The plugin manifest validates with the Claude Code CLI.
on:
  pull_request:
  push:
    branches: [main]
    tags: ['nasa-daac-knowledge--v*']
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bundle
    steps:
      # This repository and build-kit are checked out side by side, the
      # way a developer's workspace holds them, so the wording scan over
      # this tree never walks the other one.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: bundle
          fetch-depth: 0   # signature_check reads the signing commits
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: open-science-pillars/build-kit
          path: build-kit
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Install the Claude Code CLI (the manifest validator)
        working-directory: ${{ github.workspace }}
        run: npm install -g @anthropic-ai/claude-code@2.1.252
      - name: Manifest validates
        run: claude plugin validate .
      - name: Canonical metadata validates and the manifest agrees with it
        run: uv run ../build-kit/scripts/osp.py validate . --standalone
      - name: Runtime projections are rendered from package.yaml, not hand-edited
        run: uv run ../build-kit/scripts/osp.py render . --check
      - name: The portable package conforms to Agent Plugins 1.0.0
        run: uv run ../build-kit/scripts/osp.py plugin-check .
      - name: Release lock, reported (content may move between releases)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: uv run ../build-kit/scripts/osp.py lock . --report
      - name: Release lock, enforced (a release tag digests to its lock)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: uv run ../build-kit/scripts/osp.py lock . --check
      - name: Check routine, signature debt reported
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: SIGNATURE_DEBT=report bash tools/run_checks.sh
      - name: Check routine, signature debt enforced (a release tag owes nothing)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: bash tools/run_checks.sh
