name: gate
# The repository's check routine, tools/run_checks.sh, on every change:
# both bundles conform to OKF v0.2, every tool passes its selftest, and
# the signature debt is measured. The debt is reported on pull requests
# and on main (SPEC 5.4: a concept may owe a signature between a merge
# and its re-sign) and enforced on a release tag, which must owe none.
# The plugin manifest validates with the Claude Code CLI.
on:
  pull_request:
  push:
    branches: [main]
    tags: ['nasa-daac-knowledge--v*']
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0   # signature_check reads the signing commits
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Install the Claude Code CLI (the manifest validator)
        run: npm install -g @anthropic-ai/claude-code@2.1.252
      - name: Manifest validates
        run: claude plugin validate .
      - name: Check routine, signature debt reported
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: SIGNATURE_DEBT=report bash tools/run_checks.sh
      - name: Check routine, signature debt enforced (a release tag owes nothing)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: bash tools/run_checks.sh
