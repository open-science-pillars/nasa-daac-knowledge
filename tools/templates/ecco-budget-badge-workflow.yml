# Adopter snippet: attach the "closes the budget" badge to a repository.
# Requires: your notebook or script writes receipt.json (the executor
# contract from the ECCO heat budget Attested Computation concept,
# knowledge/podaac/computations/ecco-heat-budget.md) from a data tree the
# verify tool has stamped with RECORD.json. Pin this repository by its
# release tag ({name}--v{version}); never a branch.
name: ecco-budget-attestation
on: [push, workflow_dispatch]
jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the canonical attester and computation (pinned by release tag)
        run: |
          git clone --depth 1 --branch nasa-daac-knowledge--v2026.9.3 \
            https://github.com/open-science-pillars/nasa-daac-knowledge tooling
      - name: Run budget and produce receipt
        run: python run_budget.py --receipt receipt.json   # your executor
      - name: Attest
        run: |
          python tooling/tools/ecco_budget_badge.py receipt.json \
            --badge .badges/ecco-budget.json --label "ecco heat budget"
      - name: Publish badge JSON
        uses: EndBug/add-and-commit@v9
        with: { add: ".badges/ecco-budget.json", message: "update budget badge" }
# README badge line:
# ![ecco budget](https://img.shields.io/endpoint?url=<raw-url-to-.badges/ecco-budget.json>)
