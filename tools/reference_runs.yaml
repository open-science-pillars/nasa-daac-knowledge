# The reference runs of the sanctioned computations, in the form
# tools/reattest.py reruns: the arguments each Attested Computation
# concept documents as its reference run on the fixture cache, so a
# deliberate edit to a computation is re-attested with one command
# rather than a hunt through the concept for the parameters. A run
# names its computation (under its bundle's references/computations;
# the bundle is knowledge/podaac unless the run's `bundle` key names
# another, such as knowledge/asdc), its arguments, and the data root it reads (a key of data_roots, or
# none for a computation that reads another run's receipt, named in
# needs and substituted for "{receipt:NAME}"). The attester is read
# from the concept whose frontmatter names the computation; a run may
# name its own.
data_roots:
  fixtures: ~/ECCO_V4r4          # the verified fixture cache, record ecco-v4r4-fixtures-2010
  record: ~/ECCO_V4r4_record     # the verified science record, 1992 to 2017
  sea-level-budget: knowledge/podaac/references/retrieval/sea-level-budget-root   # the three-term data root, stamped in the tree
  energy-budget: knowledge/asdc/references/retrieval/energy-budget-root   # the radiation term and the Argo receipt, stamped in the tree (asdc)
runs:
  heat-budget:
    computation: ecco_heat_budget.py
    args: [--year, "2010", --region, tile1-interior]
  ohc:
    computation: ecco_ohc.py
    args: [--months, "2010-01", "2010-12"]
  geostrophy:
    computation: ecco_geostrophy.py
    args: [--month, "2009-12"]
  curl-ekman:
    computation: ecco_curl_ekman.py
    args: [--month, "2009-12"]
  thermal-wind:
    computation: ecco_thermal_wind_reconstruction.py
    args: [--month, "2009-12"]
  flux-decomposition:
    computation: ecco_flux_decomposition.py
    args: [--region, southeast-atlantic-upper, --grouping, full-four-term, --year, "2010"]
  regional-heat:
    computation: ecco_regional_budget.py
    args: [--budget, heat, --region, southeast-atlantic-upper, --year, "2010"]
  regional-salt:
    computation: ecco_regional_budget.py
    args: [--budget, salt, --region, southeast-atlantic-upper, --year, "2010"]
  regional-volume:
    computation: ecco_regional_budget.py
    args: [--budget, volume, --region, southeast-atlantic-upper, --year, "2010"]
  section-transport:
    computation: ecco_section_transport.py
    args: [--section, global-26.5n, --year, "2010"]
  steric:
    computation: ecco_steric_height.py
    args: [--region, us-northeast-coast, --months, "2010-01", "2010-02", "2010-03", "2010-04", "2010-05", "2010-06", "2010-07", "2010-08", "2010-09", "2010-10", "2010-11", "2010-12"]
  sea-level:
    computation: ecco_regional_sea_level.py
    args: [--region, us-northeast-coast, --period, "2010-01:2010-12"]
  trend-ci:
    computation: ecco_trend_ci.py
    needs: steric
    data_root: none
    args: [--source, "{receipt:steric}", --field, steric_mean_m_by_month, --value-units, m, --scale, "1000", --report-units, mm, --deseasonalize, none]
  sea-level-budget:
    computation: sea_level_budget.py
    data_root: none
    args: [--fixture, --seed, "7", --period, "2005-01:2016-12", --runtime, reattest]
  sea-level-budget-record:
    computation: sea_level_budget.py
    data_root: sea-level-budget
    args: [--period, "2005-01:2016-12", --runtime, reattest]
# Runs of computations in other bundles of this repository, keyed by the
# bundle they live in and in the same shape as the runs above; the ritual
# takes --bundle for them (reattest.py --bundle knowledge/asdc ...), and its
# registry loader and selftest read the podaac runs above only, so these
# stay here until the loader honours the bundle key.
bundles:
  knowledge/asdc:
    energy-budget:
      computation: energy_budget.py
      attester: references/attesters/energy_budget_check.py
      data_root: none
      args: [--fixture, --seed, "7", --window, "2006-01:2020-12", --runtime, reattest]
    energy-budget-record:
      computation: energy_budget.py
      attester: references/attesters/energy_budget_check.py
      data_root: energy-budget
      args: [--window, "2006-01:2020-12", --runtime, reattest]
