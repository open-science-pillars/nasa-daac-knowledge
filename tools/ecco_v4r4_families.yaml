# ECCO V4r4 collection family manifest
# Seed data for the fields layer (knowledge/podaac/fields/ecco-v4r4/), one concept per family.
#
# Provenance flags on variables:
#   granule-verified-2026-07-04   loaded live in the OSP catalog sweep
#   catalog                       recorded in ocean-science variable catalog (per the
#                                 ECCO v4r4 user guide; granule-verify at first load)
#   guide-pending                 family known, variables not yet enumerated here;
#                                 MUST be granule-verified at authoring time
#
# ShortName provenance: union of the OSP catalog CMR sweep (2026-07-04, 51 llc90
# V4R4* collections) and the ecco-group.org dataset gallery listing (fetched
# 2026-08-28). tools/verify_cmr.py re-verifies every name live and reconciles
# this manifest against the full CMR sweep; treat verify_cmr output as the
# authority and this file as the seed.
#
# Grid/cadence key inside shortnames: 05DEG (interpolated 0.5 degree),
# LLC0090GRID (native), DAILY, MONTHLY, SNAPSHOT, V4R4B (corrected geodetic
# re-release), TIME_SERIES (1D global).

meta:
  product: ECCO V4r4 central estimate
  period: 1992 through 2017
  grids: [llc90 native (13 tiles, 50 levels), 0.5 degree interpolated, 1D time series]
  landing_base: https://podaac.jpl.nasa.gov/dataset/
  sweep_reference: 2026-08-30 (live per-name check and sweep, 90/90 reconciled clean, recorded in open-science-pillars/marketplace#10); re-run tools/verify_cmr.py --sweep and update

